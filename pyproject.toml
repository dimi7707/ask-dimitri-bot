[project]
name = "askdimitri-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "boto3>=1.43.78",
    "docx2txt>=0.9",
    "fastapi>=0.141.1",
    "langchain-aws>=1.7.3",
    "langchain-core>=1.6.0",
    "llama-index-core>=0.14.24",
    "llama-index-readers-file>=0.6.0",
    "mangum>=0.22.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-pptx>=1.0.2",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.1",
]
